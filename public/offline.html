<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pas de connexion — FarataNikah</title>
<style>
  :root {
    --primary-50: #eaf6f0;
    --primary-100: #cdeadd;
    --primary-600: #0f6947;
    --primary-700: #0b5439;
    --primary-800: #08402c;
    --primary-900: #063222;
    --cream-50: #fefdfb;
    --cream-100: #fbf9f4;
    --red-100: #fee2e2;
    --red-500: #ef4444;
    --red-600: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(to bottom, var(--cream-100), var(--primary-50));
    color: var(--primary-900);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
    text-align: center;
  }
  .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    border-radius: 999px;
    background: var(--red-100);
    color: var(--red-500);
  }
  h1 {
    margin: 24px 0 0;
    font-size: 20px;
    font-weight: 700;
  }
  p.desc {
    margin: 8px 0 0;
    font-size: 14px;
    line-height: 1.6;
    color: rgba(6, 50, 34, 0.6);
    max-width: 320px;
  }
  p.meta {
    margin: 12px 0 0;
    font-size: 12px;
    color: rgba(6, 50, 34, 0.4);
  }
  .actions {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--primary-600);
    color: var(--cream-50);
  }
  .btn-primary:hover { background: var(--primary-700); }
  .btn-secondary {
    background: var(--cream-50);
    color: var(--primary-800);
    border: 1px solid var(--primary-100);
  }
  .btn-secondary:hover { background: var(--primary-50); }
  .verse {
    margin-top: 32px;
    max-width: 320px;
    border-radius: 12px;
    border: 1px solid var(--primary-100);
    background: var(--primary-50);
    padding: 16px 20px;
  }
  .verse p:first-child {
    margin: 0;
    font-size: 14px;
    font-style: italic;
    color: var(--primary-800);
  }
  .verse p:last-child {
    margin: 4px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary-600);
  }
  .spin {
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <span class="icon">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
  </span>

  <h1>Pas de connexion</h1>
  <p class="desc">Il semble que tu sois hors ligne. Vérifie ta connexion internet et réessaie.</p>
  <p class="meta" id="meta">0 tentative • Prochaine dans 5s</p>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="retryBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="retryIcon">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Réessayer
    </button>
    <a href="/" class="btn btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Accueil
    </a>
  </div>

  <div class="verse">
    <p>&laquo; Certes, avec la difficulté vient la facilité. &raquo;</p>
    <p>— Sourate Ash-Sharh, 94:6</p>
  </div>

  <script>
    var RETRY_INTERVAL_S = 5;
    var attempts = 0;
    var secondsLeft = RETRY_INTERVAL_S;
    var checking = false;
    var meta = document.getElementById("meta");
    var retryIcon = document.getElementById("retryIcon");

    function render() {
      meta.textContent = attempts + " tentative" + (attempts !== 1 ? "s" : "") + " • Prochaine dans " + secondsLeft + "s";
    }

    function checkAndReload() {
      if (checking) return;
      checking = true;
      retryIcon.classList.add("spin");
      fetch(location.origin + "/favicon.ico", { method: "HEAD", cache: "no-store" })
        .then(function () {
          location.reload();
        })
        .catch(function () {
          checking = false;
          retryIcon.classList.remove("spin");
          attempts += 1;
          secondsLeft = RETRY_INTERVAL_S;
          render();
        });
    }

    document.getElementById("retryBtn").addEventListener("click", checkAndReload);

    setInterval(function () {
      if (checking) return;
      secondsLeft -= 1;
      if (secondsLeft <= 0) {
        checkAndReload();
      } else {
        render();
      }
    }, 1000);

    window.addEventListener("online", function () {
      location.reload();
    });

    render();
  </script>
</body>
</html>
